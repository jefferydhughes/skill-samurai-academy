*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

// Revenue Calculator
const scenarios = {
  conservative: {
    students: 40, fee: 109, venue: 1200, royaltyPct: 0.08,
    note: 'Part-time hours. Strong income supplement for a working teacher.'
  },
  target: {
    students: 60, fee: 109, venue: 1600, royaltyPct: 0.08,
    note: 'Target territory. Sustainable as a primary income source.'
  },
  scaled: {
    students: 100, fee: 109, venue: 2200, royaltyPct: 0.08,
    note: 'Two venues, multi-session. Full-time income, part-time hours.'
  }
};

function setScenario(btn, key) {
  document.querySelectorAll('.rev-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  const s = scenarios[key];
  const gross = s.students * s.fee;
  const royalty = Math.round(gross * s.royaltyPct);
  const fixed = 350 + 150; // insurance+software + marketing
  const net = gross - s.venue - royalty - fixed;

  document.getElementById('rev-students').textContent = s.students + ' students enrolled';
  document.getElementById('rev-amount').textContent = '$' + gross.toLocaleString();
  document.getElementById('rev-fee').textContent = '$' + s.fee + '/mo';
  document.getElementById('rev-venue').textContent = '−$' + s.venue.toLocaleString();
  document.getElementById('rev-royalty').textContent = '−$' + royalty.toLocaleString();
  document.getElementById('rev-net').textContent = '~$' + net.toLocaleString();
  document.getElementById('rev-note').textContent = s.note;
}

// Scroll Reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.08 });

document.querySelectorAll('.reveal').forEach((el, i) => {
  observer.observe(el);
});

// Stagger grid children
document.querySelectorAll('.deliverables-grid, .persona-cards, .fp-grid').forEach(grid => {
  grid.querySelectorAll(':scope > *').forEach((child, i) => {
    child.style.transitionDelay = `${i * 0.08}s`;
  });
});
</script>
